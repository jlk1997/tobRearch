name: 蜂算科研

on:
  push:
    paths:
      - "platform/**"
      - "web_next/**"
      - "openlens_ai/agents/paper_reproducer/**"
      - "openlens_ai/state.py"
      - "openlens_ai/build_graph.py"
      - "openlens_ai/main.py"
      - "deploy/**"
      - "tests/unit/test_windows_copytree.py"
      - ".github/workflows/fengsuan.yml"
  pull_request:
    paths:
      - "platform/**"
      - "web_next/**"
      - "openlens_ai/agents/paper_reproducer/**"
      - "openlens_ai/state.py"
      - "openlens_ai/build_graph.py"
      - "openlens_ai/main.py"
      - "deploy/**"
      - "tests/unit/test_windows_copytree.py"
      - ".github/workflows/fengsuan.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -r platform/requirements.txt pytest ruff
          pip install -e .
      - name: Ruff (syntax / undefined names)
        run: ruff check platform/fengsuan --select E9,F63,F7,F82
      - name: Pytest
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/platform
        run: python -m pytest platform/tests tests/unit/test_windows_copytree.py -q -m "not nightly"
      - name: Agent 评测阈值（工具选择 / 引用可追溯 / 拒答 / 步数）
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/platform
        run: python -m pytest platform/tests/test_agent_eval.py -q

  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web_next/package-lock.json
      - name: Install and build
        working-directory: web_next
        run: |
          npm ci
          npm run build

  image-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f deploy/Dockerfile.api -t fengsuan-api:ci .
      - name: Build web image
        run: docker build -f deploy/Dockerfile.web -t fengsuan-web:ci .
      - name: Import smoke
        run: docker run --rm fengsuan-api:ci python -c "from fengsuan.app.main import create_app; create_app()"
      - name: Nginx config smoke
        run: docker run --rm fengsuan-web:ci nginx -t

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web_next/package-lock.json
      - name: Collect Playwright specs
        working-directory: web_next
        run: |
          npm ci
          npx --yes playwright@1.49.0 test --list
