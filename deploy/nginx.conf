# A2：文献 PDF 缓存。键里带凭据，禁止跨用户复用同一份缓存。
proxy_cache_path /var/cache/nginx/fengsuan_pdf levels=1:2 keys_zone=fengsuan_pdf:10m max_size=1g inactive=2h use_temp_path=off;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 64m;
    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    # A2：阅读器改成渐进加载后，这里会来一串 Range 请求。
    # 上游 Range 清空 → nginx 缓存整份 → 后续区间直接从缓存切，不再打后端。
    location ~ ^/api/v1/literature/[^/]+/pdf$ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header If-None-Match $http_if_none_match;
        proxy_set_header Range "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_cache fengsuan_pdf;
        proxy_cache_key "$request_method$host$request_uri|$http_authorization";
        proxy_cache_valid 200 30m;
        proxy_cache_valid 404 1m;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating;
        proxy_ignore_headers Cache-Control Expires;
        proxy_force_ranges on;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    location ~ ^/api/v1/literature/[^/]+/analyze$ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_next_upstream off;
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location /health {
        proxy_pass http://api:8000/health;
        proxy_set_header Host $host;
    }

    location /assets/ {
        types {
            application/javascript js mjs;
            text/css css;
            application/json json;
            image/png png;
            image/jpeg jpg jpeg;
            image/svg+xml svg;
            font/woff2 woff2;
        }
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-store";
    }
}
