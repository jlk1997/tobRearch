# 与现有业务并存：不占用宿主机 80 / 8000 / 5432。
# 访问：http://<公网IP>:18080
name: fengsuan

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: fengsuan
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: fengsuan
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fengsuan"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    environment:
      DATABASE_URL: postgresql+psycopg://fengsuan:${POSTGRES_PASSWORD}@postgres:5432/fengsuan
      SECRET_KEY: ${SECRET_KEY}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN}
      CORS_ORIGINS: ${CORS_ORIGINS}
      FENGSUN_WORKER: "0"
      FENGSUN_SEED_GUIDE_LAB: "1"
      FILE_ROOT: /app/data
      GPU_MODE: ${GPU_MODE:-off}
      GROBID_URL: ${GROBID_URL:-http://grobid:8070}
      FENGSUN_SERPAPI_KEY: ${FENGSUN_SERPAPI_KEY:-}
      FENGSUN_SCHOLAR_MODE: ${FENGSUN_SCHOLAR_MODE:-auto}
      FENGSUN_SCHOLAR_PROXY: ${FENGSUN_SCHOLAR_PROXY:-}
      FENGSUN_SCHOLAR_INTERVAL: ${FENGSUN_SCHOLAR_INTERVAL:-8}
      BOCHA_API_KEY: ${BOCHA_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      FENGSUN_CONTACT_EMAIL: ${FENGSUN_CONTACT_EMAIL:-}
      S2_API_KEY: ${S2_API_KEY:-}
      CORE_API_KEY: ${CORE_API_KEY:-}
      FENGSUN_NATIVE_WEB_LOOP: ${FENGSUN_NATIVE_WEB_LOOP:-0}
      GUEST_MONTHLY_TOKEN_BUDGET: ${GUEST_MONTHLY_TOKEN_BUDGET:-2000000}
    volumes:
      - fengsuan_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    command: python -u -m fengsuan.app.worker
    environment:
      DATABASE_URL: postgresql+psycopg://fengsuan:${POSTGRES_PASSWORD}@postgres:5432/fengsuan
      SECRET_KEY: ${SECRET_KEY}
      PYTHONUNBUFFERED: "1"
      FILE_ROOT: /app/data
      GPU_MODE: ${GPU_MODE:-off}
      GROBID_URL: ${GROBID_URL:-http://grobid:8070}
      FENGSUN_SERPAPI_KEY: ${FENGSUN_SERPAPI_KEY:-}
      FENGSUN_SCHOLAR_MODE: ${FENGSUN_SCHOLAR_MODE:-auto}
      FENGSUN_SCHOLAR_PROXY: ${FENGSUN_SCHOLAR_PROXY:-}
      FENGSUN_SCHOLAR_INTERVAL: ${FENGSUN_SCHOLAR_INTERVAL:-8}
      BOCHA_API_KEY: ${BOCHA_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      FENGSUN_CONTACT_EMAIL: ${FENGSUN_CONTACT_EMAIL:-}
      S2_API_KEY: ${S2_API_KEY:-}
      CORE_API_KEY: ${CORE_API_KEY:-}
      FENGSUN_NATIVE_WEB_LOOP: ${FENGSUN_NATIVE_WEB_LOOP:-0}
      GUEST_MONTHLY_TOKEN_BUDGET: ${GUEST_MONTHLY_TOKEN_BUDGET:-2000000}
    volumes:
      - fengsuan_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from fengsuan.app.core.concurrency import read_sidecar_tick; raise SystemExit(0 if read_sidecar_tick() else 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 40s
    restart: unless-stopped

  # 论文结构解析：章节、作者、参考文献。挂了或没起来时平台退回按页切，不影响入库。
  grobid:
    image: lfoppiano/grobid:0.8.1
    environment:
      JAVA_OPTS: "-Xmx2g"
    mem_limit: 3g
    cpus: 2
    healthcheck:
      # 镜像里没有 curl，用 bash 自带的 /dev/tcp 问一下 isalive。
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8070 && printf 'GET /api/isalive HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q true <&3"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 90s
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    ports:
      - "18080:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # 没有令牌时不要启动。有 NGROK_AUTHTOKEN 后再：
  # docker compose -f docker-compose.cloud.yml --profile tunnel up -d ngrok
  ngrok:
    profiles: ["tunnel"]
    build:
      context: .
      dockerfile: Dockerfile.ngrok
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
      NGROK_DOMAIN: ${NGROK_DOMAIN:-}
    depends_on:
      - web
    restart: unless-stopped

volumes:
  pgdata:
  fengsuan_data:
